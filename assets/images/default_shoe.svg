<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%">
  <defs>
    <!-- Premium Linear Gradient matching Solesociety theme -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" fill="#f1f5f9" rx="24"/>
  <rect x="20" y="20" width="760" height="640" fill="url(#grad)" rx="16" opacity="0.95"/>

  <!-- Subtle abstract vector lines representing speed -->
  <path d="M 100,500 L 700,200" stroke="rgba(255,255,255,0.1)" stroke-width="8" stroke-dasharray="15 10" />
  <path d="M 100,550 L 700,250" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  <path d="M 100,450 L 700,150" stroke="rgba(255,255,255,0.05)" stroke-width="12" />

  <!-- Shoe Silhouette Path (Modern high-fidelity athletic shoe) -->
  <g transform="translate(180, 160) scale(0.9)" filter="url(#glow)">
    <!-- Soles / Bottom grip -->
    <path d="M 60,320 Q 120,335 220,330 Q 320,320 400,280 Q 420,270 410,260 Q 390,265 370,265 L 120,285 Q 70,290 60,320 Z" fill="#ffffff" />
    <path d="M 75,320 L 395,283" stroke="#e2e8f0" stroke-width="3" />
    
    <!-- Midsole cushion -->
    <path d="M 65,300 Q 120,315 220,310 Q 320,300 395,263 Q 410,255 405,248 Q 390,252 370,252 L 120,270 Q 75,275 65,300 Z" fill="#f8fafc" />

    <!-- Main Upper Body -->
    <path d="M 68,285 
             Q 60,250 85,210 
             Q 110,170 160,165 
             Q 185,160 210,120
             Q 220,105 235,110
             Q 250,115 255,145
             Q 260,175 305,205
             Q 350,235 385,248
             Q 395,252 390,256
             Q 360,252 340,252
             L 120,270
             Q 75,275 68,285 Z" fill="#ffffff" />

    <!-- Details/Patterns on upper -->
    <path d="M 120,210 Q 150,185 200,210" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 130,225 Q 165,200 215,225" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 140,240 Q 180,215 230,240" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Laces / Tongue -->
    <path d="M 210,125 L 250,180" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" />
    <path d="M 195,145 L 240,195" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" />
    <path d="M 180,165 L 230,210" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" />
    
    <!-- Heel collar -->
    <path d="M 160,165 Q 185,160 210,120 Q 215,125 205,140 Q 190,160 160,165 Z" fill="#cbd5e1" />
  </g>

  <!-- Typography overlay -->
  <text x="50%" y="90%" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="4">SOLESOCIETY PREMIUM</text>
</svg>
